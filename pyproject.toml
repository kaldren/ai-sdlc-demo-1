[project]
name = "leya-workspace"
version = "0.0.0"
description = "Leya Enterprises monorepo (uv workspace root)"
requires-python = ">=3.13,<3.14"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "packages/leya_rag", "tools/knowledge-mcp"]

[tool.uv.sources]
leya-api = { workspace = true }
leya-rag = { workspace = true }
leya-knowledge-mcp = { workspace = true }

[dependency-groups]
dev = [
  "leya-api",
  "leya-rag",
  "leya-knowledge-mcp",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-first-party = ["leya_api", "leya_rag", "leya_knowledge_mcp"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["leya_api", "leya_rag", "leya_knowledge_mcp"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests", "packages/leya_rag/tests", "tools/knowledge-mcp/tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
