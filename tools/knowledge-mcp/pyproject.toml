[project]
name = "leya-knowledge-mcp"
version = "0.1.0"
description = "MCP server exposing the SDLC knowledge index (intents, specs, ADRs, code) to Claude Code and CI agents"
requires-python = ">=3.13,<3.14"
dependencies = ["leya-rag"]  # MCP + retriever deps arrive with the knowledge-MCP change

[tool.uv.sources]
leya-rag = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leya_knowledge_mcp"]
